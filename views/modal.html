<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Site de recettes">
    <meta name="keywords" content="Recettes en ligne">
    <meta name="author" content="Marvin, Antoine">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../public/css/root.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Shrikhand&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.js"></script>
    <script src="../controllers/js/template.js" defer></script>
    <script src="../controllers/js/listecourse.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.4.0/jspdf.umd.min.js"></script>
    
   
    <title>Tasty</title>
</head>
<body class="h-screen">
    <header>
        <div id="header"></div>  
    </header> 
    <main class="p-4">
        <h1 class="text-2xl font-bold mb-4">Liste de Courses</h1>
        <!-- Icône pour ouvrir la sidebar -->
        <i id="open-sidebar" class="fa-solid fa-basket-shopping fa-sm" style="color: #63E6BE;"></i>

        <!-- Sidebar masquée par défaut -->
        <div id="sidebar" class="fixed top-0 right-0 h-full w-80 bg-white shadow-lg transform translate-x-full transition-transform duration-300">
            <div class="p-4">
                <button id="close-sidebar" class="text-red-500 font-bold mb-4">Fermer</button>
                <h2 class="text-xl font-bold mb-4">Liste de Courses</h2>
                <div id="sidebar-content">
                    <!-- La liste des recettes et le bouton PDF seront ajoutés ici dynamiquement -->
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div id="footer"></div>
    </footer>
</body>
</html>
